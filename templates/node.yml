# =============================================================================
# Pushgate v2 configuration - Node.js
# https://github.com/rootstrap/ai-pushgate
# =============================================================================

version: 2

ai:
  mode: blocking
  max_changed_lines: 500
  max_prompt_tokens: 12000
  timeout_seconds: 120
  provider: claude
  providers:
    claude:
      model: claude-sonnet-4-20250514

review:
  target_branch: main
  context_lines: 10
  max_lines_for_full_file: 300

tools:
  - name: eslint
    command: ["npx", "eslint", "{changed_files}"]
    extensions: [".js", ".jsx", ".mjs", ".cjs", ".ts", ".tsx"]

  - name: prettier
    command: ["npx", "prettier", "--check", "{changed_files}"]
    extensions:
      [".js", ".jsx", ".mjs", ".cjs", ".ts", ".tsx", ".json", ".css", ".md"]

  - name: jest
    command: ["npx", "jest", "--passWithNoTests", "--findRelatedTests", "{changed_files}"]
    extensions: [".js", ".jsx", ".mjs", ".cjs", ".ts", ".tsx"]

ignore_paths:
  - "*.lock"
  - "package-lock.json"
  - "pnpm-lock.yaml"
  - "yarn.lock"
  - "dist/**"
  - "build/**"
  - "coverage/**"
