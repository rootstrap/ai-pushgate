# =============================================================================
# Pushgate v2 configuration - Ruby on Rails
# https://github.com/rootstrap/ai-pushgate
# =============================================================================

version: 2

ai:
  mode: blocking
  max_changed_lines: 500
  max_prompt_tokens: 12000
  timeout_seconds: 120
  provider: claude
  providers:
    claude:
      model: claude-sonnet-4-20250514

review:
  target_branch: main
  context_lines: 10
  max_lines_for_full_file: 300

tools:
  - name: rubocop
    command: ["bundle", "exec", "rubocop", "{changed_files}"]
    extensions: [".rb", ".rake", ".gemspec", ".ru"]

  - name: reek
    command: ["bundle", "exec", "reek", "{changed_files}"]
    extensions: [".rb"]

  - name: brakeman
    # Security vulnerability scanner for Rails; runs on the whole project.
    command: ["bundle", "exec", "brakeman", "--no-pager", "--quiet"]
    run: always

  - name: rspec
    command: ["bundle", "exec", "rspec", "--format", "progress"]
    extensions: [".rb"]

ignore_paths:
  - "Gemfile.lock"
  - "*.lock"
  - "db/schema.rb"
  - "db/structure.sql"
  - "tmp/**"
  - "log/**"
  - "coverage/**"
  - "vendor/**"
  - "public/assets/**"
