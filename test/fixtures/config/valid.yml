# Comments and multiline arrays must survive the real YAML parser path.
version: 2

review:
  target_branch: develop
  context_lines: 14
  max_lines_for_full_file: 450

tools:
  - name: eslint
    command:
      - npx
      - eslint
      - "{changed_files}"
    extensions:
      - ".js"
      - ".ts"
    timeout_seconds: 12
    mode: warning
    run: changed_files
    fail_fast: false

policies:
  diff_size:
    max_changed_lines: 250
    mode: warning
  forbidden_paths:
    patterns:
      - ".env"
      - "secrets/**"
    mode: blocking

ai:
  mode: advisory
  max_changed_lines: 750
  max_prompt_tokens: 16000
  timeout_seconds: 90
  provider: claude
  providers:
    claude:
      model: claude-sonnet-4-20250514
      transport:
        auth:
          source: cli
        flags:
          - quiet
    copilot:
      model: gpt-5

ignore_paths:
  - "*.lock"
  - "dist/**"
